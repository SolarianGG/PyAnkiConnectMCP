[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "anki-connect-mcp"
version = "0.1.0"
description = "MCP server for the Anki-Connect API v1"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.3,<3",
    "httpx>=0.27",
    "anyio>=4",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
anki-connect-mcp = "anki_connect_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/anki_connect_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
